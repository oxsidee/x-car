<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: полноэкранная 3D-сцена, слева источник и жгуты, справа карточка провода; на телефоне — нижние шторки.
   Одна тёмная тема по выбору: графит гаража, янтарный акцент как подсветка щитка Нивы. */
:root {
  --bg: #0c1013; --panel: #12181c; --panel-2: #182025; --line: #253038; --fg: #dde5ea; --muted: #8796a1;
  --accent: #f2a531; --accent-ink: #1a1206; --warn: #e5a03a;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --side: 330px; --drawer: 410px; --top: 52px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); display: grid; grid-template-rows: var(--top) 1fr; }
header { display: flex; align-items: center; gap: 16px; padding-inline: 16px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font: 700 15px/1 var(--f-display); letter-spacing: .02em; margin: 0; white-space: nowrap; }
.brand span { color: var(--muted); font: 12px var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-actions { margin-left: auto; display: flex; gap: 8px; }
.icon-btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; white-space: nowrap; }
.icon-btn:hover { border-color: var(--muted); }
#menuBtn { display: none; width: 40px; height: 40px; flex: none; align-items: center; justify-content: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 0; }
#menuBtn span, #menuBtn span::before, #menuBtn span::after { display: block; width: 18px; height: 2px; border-radius: 1px; background: var(--fg); position: relative; content: ""; }
#menuBtn span::before { position: absolute; top: -6px; } #menuBtn span::after { position: absolute; top: 6px; }
#mSlot { display: none; }
#backdrop { display: none; }

main { position: relative; min-height: 0; display: grid; grid-template-columns: var(--side) 1fr var(--drawer); }
aside { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
#side { border-right: 1px solid var(--line); }
#drawer { border-left: 1px solid var(--line); overflow-y: auto; }
#stage { position: relative; min-width: 0; min-height: 0; }
#stage canvas { display: block; }

.side-head { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.lbl-sm { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.src-box { display: grid; gap: 6px; }
#source { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.src-sub { font-size: 12px; color: var(--muted); line-height: 1.4; }
#search { width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
#search::placeholder { color: var(--muted); }
.harness-list { display: grid; gap: 2px; }
.h-row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 6px; cursor: pointer; user-select: none; }
.h-row:hover { background: var(--panel-2); }
.h-row input { margin: 0; accent-color: var(--accent); }
.h-row b { font-weight: 600; display: block; font-size: 13px; }
.h-row small { color: var(--muted); font-size: 11.5px; display: block; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.cnt { font: 11px var(--f-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.wire-list { overflow-y: auto; flex: 1; padding: 8px 8px 16px; }
.wl-group { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px; }
.wl-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 8px; }
.wl-item:hover { background: var(--panel-2); }
.wl-item.sel { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.wl-item > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.wl-item .pin { font: 11px var(--f-mono); color: var(--muted); }
.swatch { width: 28px; height: 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,.15); box-sizing: border-box; display: inline-block; }
.swatch.unk { background-image: repeating-linear-gradient(45deg, #c7ccd1 0 3px, #6b737a 3px 6px) !important; }

.toolbar { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); z-index: 3; }
.toolbar .grp { display: flex; flex-wrap: wrap; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; backdrop-filter: blur(6px); }
.toolbar button { background: none; border: 0; padding: 7px 10px; font-size: 12.5px; color: var(--fg); border-right: 1px solid var(--line); }
.toolbar .grp button:last-child { border-right: 0; }
.toolbar button:hover { background: var(--panel-2); }
.toolbar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toolbar label { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; color: var(--muted); }
.toolbar input[type=range] { width: 90px; accent-color: var(--accent); }
.hint { position: absolute; left: 12px; bottom: 12px; font: 11.5px var(--f-mono); color: var(--muted); pointer-events: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
#tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; transform: translate(12px, 12px); z-index: 5; }
#tip small { color: var(--muted); display: block; font: 11px var(--f-mono); }
.lbl { font: 600 10.5px var(--f-body); color: var(--fg); background: color-mix(in srgb, var(--bg) 75%, transparent); padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; border: 1px solid var(--line); }
.no-labels .lbl { display: none; }

.card { padding: 18px 20px 28px; display: grid; gap: 18px; }
.eyebrow { font: 600 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.card h2 { font: 700 18px/1.25 var(--f-display); margin: 4px 0 0; text-wrap: balance; }
.card h3 { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.card p { margin: 0; max-width: 65ch; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.bigswatch { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel-2); border-radius: 8px; border: 1px solid var(--line); }
.bigswatch .swatch { width: 56px; height: 16px; border-radius: 8px; flex: none; }
.bigswatch b { font-size: 14px; }
.bigswatch small { color: var(--muted); display: block; }
.pinbox { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.pinbox .num { font: 700 22px/1 var(--f-display); color: var(--accent); min-width: 36px; text-align: center; }
.pinbox small { display: block; color: var(--muted); font-size: 11.5px; }
.ends { display: grid; gap: 4px; }
.end { display: grid; grid-template-columns: 54px 1fr; gap: 8px; font-size: 13px; }
.end span:first-child { font: 11px var(--f-mono); color: var(--muted); padding-top: 2px; text-transform: uppercase; }
.siblings { display: grid; gap: 2px; }
.siblings .wl-item { padding: 5px 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.warnbox { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--accent); padding: 4px 0 4px 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--f-mono); padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--fg); background: none; }
.refs { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 12.5px; }
.intro ol { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 12.5px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend .swatch { width: 22px; }
.close { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; }

dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; width: min(640px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; overflow: hidden; }
dialog[open] { display: flex; flex-direction: column; }
.dlg-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.dlg-head h2 { font: 700 16px var(--f-display); margin: 0; }
.dlg-body { padding: 12px 18px 18px; overflow-x: auto; min-height: 0; }
.pintable { width: 100%; border-collapse: collapse; font-size: 13px; }
.pintable td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.pintable td:first-child { font: 600 13px var(--f-mono); color: var(--accent); width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.pintable tr.free td { color: var(--muted); }
.pintable button { background: none; border: 0; padding: 0; color: var(--fg); text-align: left; text-decoration: underline dotted; text-underline-offset: 3px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.tab { background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 12.5px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.pintable .sw { width: 34px; }
.conns { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.conns button { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; font-weight: 600; }
.grab { display: none; }
#stage canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#showUI { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; z-index: 30; display: none; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; font-size: 13px; backdrop-filter: blur(6px); }
body.ui-hidden #showUI { display: block; }
body.ui-hidden header, body.ui-hidden #side, body.ui-hidden #drawer, body.ui-hidden .toolbar, body.ui-hidden .hint { display: none !important; }
body.ui-hidden #app { grid-template-rows: 1fr; }
body.ui-hidden main { grid-template-columns: 1fr !important; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 12px var(--f-mono); }

@media (max-width: 1100px) { main { grid-template-columns: 290px 1fr 340px; } }
@media (max-width: 820px) {
  :root { --top: 56px; }
  header { padding-inline: 12px; gap: 12px; }
  .brand { flex: 1; }
  .brand h1 { font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .brand span { display: none; }
  #menuBtn { display: inline-flex; }
  main { grid-template-columns: 1fr; }

  /* Левое выезжающее меню: действия, виды, источник, жгуты, список проводов */
  #side { position: fixed; top: calc(env(safe-area-inset-top, 0px) + var(--top)); left: 0; bottom: 0; width: min(88vw, 360px); z-index: 40;
    transform: translateX(-102%); transition: transform .24s ease; border-right: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain;
    padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 12px 0 30px rgba(0,0,0,.45); }
  #side.open { transform: none; }
  #side .wire-list { overflow: visible; flex: none; }
  #backdrop { display: block; position: fixed; inset: calc(env(safe-area-inset-top, 0px) + var(--top)) 0 0 0; z-index: 35; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .24s; }
  body.menu-open #backdrop { opacity: 1; pointer-events: auto; }
  #mSlot { display: grid; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  #mSlot .head-actions { display: grid; grid-template-columns: 1fr 1fr; margin: 0; gap: 8px; }
  #mSlot .head-actions .icon-btn { padding: 11px 10px; }
  #mSlot .toolbar { position: static; display: grid; gap: 10px; max-width: none; }
  #mSlot .toolbar .grp { display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 8px; backdrop-filter: none; background: var(--panel-2); }
  #mSlot .toolbar .grp button { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 11px 4px; font-size: 13px; }
  #mSlot .toolbar label { grid-column: 1 / -1; display: flex; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #mSlot .toolbar input[type=range] { flex: 1; width: auto; }

  /* Шторка карточки снизу */
  #drawer { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; z-index: 10; border: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    box-shadow: 0 -10px 30px rgba(0,0,0,.4); padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .22s ease; overscroll-behavior: contain; }
  #drawer.empty { display: none; }
  #drawer.collapsed { overflow: hidden; }
  .grab { display: block; position: sticky; top: 0; z-index: 2; height: 28px; margin: 0 0 -10px; background: var(--panel); cursor: grab; }
  .grab::before { content: ""; position: absolute; left: 50%; top: 10px; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: var(--muted); opacity: .6; }
  .card { padding: 14px 16px 24px; }
  .card h2 { font-size: 17px; }
  .eyebrow { flex-wrap: wrap; row-gap: 6px; }
  .hint { right: 12px; font-size: 11px; }
  body.sheet-open .hint { display: none; }
}
@media (pointer: coarse) {
  .toolbar button { padding: 10px 12px; font-size: 13.5px; }
  .icon-btn { padding: 9px 12px; }
  .wl-item { padding: 9px 8px; }
  .h-row { padding: 8px; }
  .h-row input { width: 20px; height: 20px; }
  .close { font-size: 24px; padding: 6px 10px; }
  #tip { transform: translate(-50%, calc(-100% - 28px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildNiva } from './model.js';

const D = window.NIVA;
const { HARNESSES, COMPONENTS, CIRCUITS, PINOUT, CONNECTORS, CONN_NOTES, COLOR_NAMES, COLOR_HEX, SOURCES, REFS } = D;
const CONN_IDX = {};
CONNECTORS.forEach(k => Object.entries(k.pins).forEach(([p, v]) => { if (typeof v === 'string') (CONN_IDX[v] ||= []).push({ k, p }); }));
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const HMAP = Object.fromEntries(HARNESSES.map(h => [h.id, h]));
const COMP = Object.fromEntries(COMPONENTS.map(c => [c.id, c]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

const state = { src: 'f', visible: new Set(HARNESSES.map(h => h.id)), query: '', sel: null, hover: null };
try { const s = localStorage.getItem('niva2131-src'); if (SOURCES.some(x => x.id === s)) state.src = s; } catch {}

// ---------- Цвета ----------
const parseColor = code => code === '?' ? ['?'] : (code.match(/Кч|[БЧКЗГСЖОРФ]/g) || ['?']);
const GEN = { 'белый': 'белой', 'чёрный': 'чёрной', 'красный': 'красной', 'зелёный': 'зелёной', 'голубой': 'голубой', 'серый': 'серой', 'жёлтый': 'жёлтой', 'оранжевый': 'оранжевой', 'розовый': 'розовой', 'фиолетовый': 'фиолетовой', 'коричневый': 'коричневой' };
const colorName = code => { if (code === '?') return 'цвет не подтверждён'; const [b, s] = parseColor(code); return COLOR_NAMES[b] + (s ? ' с ' + GEN[COLOR_NAMES[s]] + ' полосой' : ''); };
const swatch = code => { if (code === '?') return '<i class="swatch unk"></i>'; const [b, s] = parseColor(code), bc = COLOR_HEX[b]; return `<i class="swatch" style="background:${s ? `linear-gradient(${bc} 0 35%, ${COLOR_HEX[s]} 35% 65%, ${bc} 65%)` : bc}"></i>`; };
const cap = s => s[0].toUpperCase() + s.slice(1);

// ---------- Данные под выбранный источник ----------
let WIRES = [], WMAP = {}, CIRC = [];
const nodePos = name => (D.NODE_ALT[state.src]?.[name]) || D.N[name];

const V3 = p => new THREE.Vector3(...(typeof p === 'string' ? nodePos(p) : p));
const texCache = {};
function wireTexture(code) {

  const g = cv.getContext('2d');
  if (code === '?') { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#6b737a' : '#c7ccd1'; g.fillRect(i, 0, 1, 64); } }

const wireGroup = new THREE.Group(); scene.add(wireGroup);
let pickMeshes = [];
const pickMat = new THREE.MeshBasicMaterial({ visible: false });
const radiusFor = w => w.circuit.h === 'hv' ? 0.0055 : Math.min(0.012, 0.0028 + Math.sqrt(w.section) * 0.0018);
function buildWires() {

  pickMeshes = [];
  CIRC.forEach((c, ci) => {
    const a = ci * 2.399, jit = new THREE.Vector3(Math.cos(a) * 0.004, Math.sin(a * 1.7) * 0.012, Math.sin(a) * 0.012);
    c.wires.forEach((_, i) => {
      const w = WMAP[c.id + '/' + i], n = c.wires.length;
      const ang = (i / n) * Math.PI * 2, r = n > 1 ? 0.006 + 0.0025 * n : 0;
      const off = new THREE.Vector3(0, Math.sin(ang) * r, Math.cos(ang) * r).add(jit);
      const pts = c.pts.map((p, k) => V3(p).add(k > 0 && k < c.pts.length - 1 ? off : off.clone().multiplyScalar(0.35)));
      const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
      const len = curve.getLength(), segs = Math.max(24, Math.round(len * 70)), rad = radiusFor(w) * (c.thick ? Math.min(1.6, c.thick) : 1);
      const tex = wireTexture(w.color).clone(); tex.needsUpdate = true; tex.repeat.set(Math.max(1, len * 8), 1);
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45, metalness: 0.05, emissive: new THREE.Color(0), transparent: true });
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, rad, 8, false), mat);
      mesh.userData = { type: 'wire', id: w.id };
      const pick = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(16, segs >> 1), Math.max(rad * 2.2, 0.014), 6, false), pickMat);
      pick.userData = { type: 'wire', id: w.id };

      Object.assign(w, { mesh, pick, curve, len });
    });

}

function matches(w) {

  return [w.name, w.circuit.name, w.color, colorName(w.color), w.from, w.to, HMAP[w.circuit.h].name, w.pin ? 'конт ' + w.pin : ''].join(' ').toLowerCase().includes(q);
}

function applyStyles() {

  const compW = sel?.type === 'comp' ? new Set(connectedWires(sel.id).map(w => w.id)) : null;
  WIRES.forEach(w => {

document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { const [t, p] = VIEWS[b.dataset.view]; animateCam(new THREE.Vector3(...t), new THREE.Vector3(...p)); if (isMobile()) setMenu(false); });

// ---------- События ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-w],[data-c],[data-close],[data-fly],[data-iso],[data-tab],[data-conn]');
  if (!t) return;
  if (t.dataset.tab) { connTab = t.dataset.tab; renderPins(); return; }

  if (t.dataset.w) { if ('pinjump' in t.dataset) $('#pinDlg').close(); select({ type: 'wire', id: t.dataset.w }, { fly: !!t.closest('#wireList') || 'pinjump' in t.dataset }); }
  else if (t.dataset.c) select({ type: 'comp', id: t.dataset.c }, { fly: true });

  }
});
$('#source').addEventListener('change', e => {
  state.src = e.target.value;
  try { localStorage.setItem('niva2131-src', state.src); } catch {}
  prepareData(); placeComponents(); buildWires(); renderSources(); renderHarnesses(); renderPins();
  select(state.sel);
});
$('#harnessList').addEventListener('change', e => {
  const h = e.target.dataset.h; if (!h) return;

});
$('#search').addEventListener('input', e => { state.query = e.target.value; renderList(); applyStyles(); });
$('#opacity').addEventListener('input', e => setBodyOpacity(+e.target.value));
const toggle = (id, fn) => { const b = $(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }; };
toggle('#tMech', on => car.groups.mech.visible = on);
toggle('#tInt', on => car.groups.interior.visible = on);
toggle('#tComp', on => compGroup.visible = on);
toggle('#tLabels', on => stage.classList.toggle('no-labels', !on));
// ---------- Телефонная раскладка: левое меню ----------
const mq = matchMedia('(max-width: 820px)');
const isMobile = () => mq.matches;
const toolbarEl = $('.toolbar'), actionsEl = $('.head-actions'), headerEl = $('header');
function layoutMobile() {
  if (isMobile()) { $('#mSlot').append(actionsEl, toolbarEl); }
  else { headerEl.append(actionsEl); stage.insertBefore(toolbarEl, $('#hint')); setMenu(false); const d = $('#drawer'); d.style.height = ''; d.style.transition = ''; d.classList.remove('collapsed'); }
}
function setMenu(open) {
  $('#side').classList.toggle('open', open);
  document.body.classList.toggle('menu-open', open);
  $('#menuBtn').setAttribute('aria-expanded', open);
}
$('#menuBtn').onclick = () => setMenu(!$('#side').classList.contains('open'));
$('#backdrop').onclick = () => setMenu(false);
mq.addEventListener('change', () => { layoutMobile(); resize(); });
layoutMobile();
$('#openPins').onclick = () => { setMenu(false); openConn(connTab); };
$('#pinClose').onclick = () => $('#pinDlg').close();
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#pinDlg').open) select(null);
  if ((e.key === 'h' || e.key === 'р' || e.key === 'H' || e.key === 'Р') && !e.target.closest('input, select, textarea') && !$('#pinDlg').open) setUIHidden(!document.body.classList.contains('ui-hidden'));
});
// Скрытие всех меню: остаётся только 3D-сцена и кнопка «Показать меню»
function setUIHidden(on) {
  document.body.classList.toggle('ui-hidden', on);
  try { localStorage.setItem('niva2131-ui-hidden', on ? '1' : ''); } catch {}
  requestAnimationFrame(() => { resize(); updateViewOffset(); });
}
$('#hideUI').onclick = () => { setMenu(false); setUIHidden(true); };
$('#showUI').onclick = () => setUIHidden(false);

// Наведение и клики по сцене
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('#tip');
function hit(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects([...pickMeshes.filter(m => m.visible), ...(compGroup.visible ? compMeshes : [])], false);
  if (!hits.length) return null;
  const wh = hits.find(h => h.object.userData.type === 'wire');
  return (wh && wh.distance - hits[0].distance < 0.15 ? wh : hits[0]).object.userData;
}
// Касания: тап — выбрать, двойной тап — показать крупно (или сбросить вид), долгое нажатие — подсказка
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
const active = new Map();
let down = null, lastTap = { t: 0, x: 0, y: 0 }, pressTimer = 0;
// На сенсоре ищем провод и вокруг точки касания: палец толще курсора
function hitNear(ev, radius) {
  const h = hit(ev); if (h || !radius) return h;
  for (const r of [radius / 2, radius]) for (let a = 0; a < 8; a++) {
    const p = { clientX: ev.clientX + Math.cos(a * Math.PI / 4) * r, clientY: ev.clientY + Math.sin(a * Math.PI / 4) * r };
    const hh = hit(p); if (hh) return hh;
  }
  return null;
}
function showTip(h, x, y) {
  const r = stage.getBoundingClientRect();
  if (!h) { tip.hidden = true; return; }
  if (h.type === 'wire') { const w = WMAP[h.id]; tip.innerHTML = `${esc(w.circuit.wires.length > 1 ? w.circuit.name + ' · ' + w.name : w.name)}<small>${w.color === '?' ? 'цвет не подтверждён' : w.color + ' · ' + colorName(w.color)} · ${w.section}${w.circuit.h === 'hv' ? ' мм' : ' мм²'}${w.pin ? ' · конт. ' + w.pin : ''}</small>`; }
  else tip.innerHTML = `${esc(COMP[h.id].name)}<small>узел · ${connectedWires(h.id).length} проводов</small>`;
  tip.hidden = false; tip.style.left = (x - r.left) + 'px'; tip.style.top = (y - r.top) + 'px';
}
renderer.domElement.addEventListener('pointerdown', e => {
  active.set(e.pointerId, e);
  if (active.size > 1) { down = null; clearTimeout(pressTimer); tip.hidden = true; return; }
  down = { x: e.clientX, y: e.clientY, t: performance.now(), type: e.pointerType, long: false };
  if (e.pointerType !== 'mouse') {
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => { if (!down) return; down.long = true; const h = hitNear(e, 22); state.hover = h?.type === 'wire' ? h.id : null; applyStyles(); showTip(h, e.clientX, e.clientY); navigator.vibrate?.(10); }, 450);
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (active.has(e.pointerId)) active.set(e.pointerId, e);
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > (down.type === 'mouse' ? 5 : 10)) { clearTimeout(pressTimer); if (!down.long) down = null; }
});
const endPointer = e => {
  active.delete(e.pointerId); clearTimeout(pressTimer);
  if (!down || e.type === 'pointercancel') { down = null; return; }
  const d = down; down = null;
  if (d.type !== 'mouse' && d.long) { setTimeout(() => { tip.hidden = true; state.hover = null; applyStyles(); }, 1200); }
  const touch = d.type !== 'mouse';
  const h = hitNear(e, touch || IS_TOUCH ? 22 : 4);
  const now = performance.now();
  const dbl = touch && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30;
  lastTap = dbl ? { t: 0, x: 0, y: 0 } : { t: now, x: e.clientX, y: e.clientY };
  if (dbl) { if (h) select({ type: h.type, id: h.id }, { fly: true }); else { const [t, p] = VIEWS.iso; animateCam(new THREE.Vector3(...t), new THREE.Vector3(...p)); } return; }
  select(h ? { type: h.type, id: h.id } : null);
  if (document.body.classList.contains('ui-hidden')) { showTip(h, e.clientX, e.clientY); clearTimeout(endPointer.t); endPointer.t = setTimeout(() => { tip.hidden = true; }, 2500); }
};
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', endPointer);
renderer.domElement.addEventListener('contextmenu', e => { if (IS_TOUCH) e.preventDefault(); });

// ---------- Шторка карточки: подъём и прокрутка работают как одно движение ----------
// Свайп вверх: сначала шторка поднимается до верха, остаток жеста прокручивает карточку.
// Свайп вниз: сначала карточка прокручивается к началу, остаток жеста опускает шторку.
const sheet = $('#drawer');
const SHEET_MIN = 84;
const sheetSnaps = () => { const max = $('main').getBoundingClientRect().height - 6; return [SHEET_MIN, Math.round(max * 0.55), max]; };
const sheetH = () => sheet.getBoundingClientRect().height;
function setSheetH(h, animate) {
  sheet.style.transition = animate ? '' : 'none';
  sheet.style.height = h + 'px';
  sheet.classList.toggle('collapsed', h <= SHEET_MIN + 2);
  if (sheet.classList.contains('collapsed')) sheet.scrollTop = 0;
}
function openSheet() {
  document.body.classList.add('sheet-open');
  const [, mid] = sheetSnaps();
  if (!sheet.style.height || sheetH() <= SHEET_MIN + 2) setSheetH(mid, true);
}
function sheetDelta(d) {                           // d > 0 — палец идёт вверх
  const [min, , max] = sheetSnaps(); let h = sheetH();
  if (d > 0) {
    const grow = Math.min(d, max - h);
    if (grow > 0) { h += grow; d -= grow; setSheetH(h); }
    if (d > 0) sheet.scrollTop += d;
  } else {
    const back = Math.min(-d, sheet.scrollTop);
    if (back > 0) { sheet.scrollTop -= back; d += back; }
    if (d < 0) setSheetH(Math.max(min, h + d));
  }
}
let sg = null, inertia = 0;
sheet.addEventListener('touchstart', e => {
  if (!isMobile() || e.touches.length > 1) return;
  cancelAnimationFrame(inertia);
  const y = e.touches[0].clientY;
  sg = { y0: y, y, t: performance.now(), v: 0, moved: false, grab: !!e.target.closest('.grab') };
}, { passive: true });
sheet.addEventListener('touchmove', e => {
  if (!sg) return;
  const y = e.touches[0].clientY, now = performance.now();
  if (!sg.moved && Math.abs(y - sg.y0) < 6) return;
  sg.moved = true;
  e.preventDefault();
  const d = sg.y - y, dt = Math.max(1, now - sg.t);
  sg.v = 0.8 * (d / dt) + 0.2 * sg.v;              // сглаженная скорость, px/мс
  sg.y = y; sg.t = now;
  sheetDelta(d);
}, { passive: false });
function endSheetGesture() {
  if (!sg) return;
  const g = sg; sg = null;
  const [min, mid, max] = sheetSnaps(), h = sheetH();
  if (!g.moved) { if (g.grab) setSheetH(h <= min + 2 ? mid : min, true); return; }
  if (performance.now() - g.t > 120) g.v = 0;        // палец остановился перед отпусканием
  if (h >= max - 1 && sheet.scrollTop > 0 || (h >= max - 1 && g.v > 0)) {
    // Шторка поднята: докручиваем карточку по инерции
    let v = g.v * 16, last = performance.now();
    const step = now => {
      const dt = Math.min(32, now - last) / 16; last = now;
      v *= Math.pow(0.95, dt);
      if (Math.abs(v) < 0.3) return;
      const before = sheet.scrollTop; sheet.scrollTop += v * dt;
      if (sheet.scrollTop === before) return;
      inertia = requestAnimationFrame(step);
    };
    inertia = requestAnimationFrame(step);
    return;
  }
  // Шторка между положениями: прилипаем к ближайшему с учётом скорости
  const snaps = [min, mid, max];
  let target = snaps.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a);
  if (g.v > 0.5) target = snaps.find(s => s > h + 4) ?? max;
  if (g.v < -0.5) target = [...snaps].reverse().find(s => s < h - 4) ?? min;
  setSheetH(target, true);
}
sheet.addEventListener('touchend', endSheetGesture);
sheet.addEventListener('touchcancel', endSheetGesture);
// Мышью шторку тоже можно тянуть за ручку (узкое окно на компьютере)
sheet.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || !e.target.closest('.grab')) return;
  let last = e.clientY, moved = false;
  const g = e.target.closest('.grab'); g.setPointerCapture(e.pointerId);
  const move = ev => { const d = last - ev.clientY; if (Math.abs(ev.clientY - e.clientY) > 4) moved = true; last = ev.clientY; if (moved) sheetDelta(d); };
  const up = () => { g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); const [min, mid] = sheetSnaps(); if (!moved) setSheetH(sheetH() <= min + 2 ? mid : min, true); };
  g.addEventListener('pointermove', move); g.addEventListener('pointerup', up);
});
if (IS_TOUCH) $('#hint').textContent = '1 палец — вращать · 2 пальца — зум и сдвиг · тап — описание · двойной тап — крупно';

let hoverRaf = 0;
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  if (e.buttons) { tip.hidden = true; return; }
  cancelAnimationFrame(hoverRaf);
  hoverRaf = requestAnimationFrame(() => {
    const h = hit(e), nh = h?.type === 'wire' ? h.id : null;
    if (nh !== state.hover) { state.hover = nh; applyStyles(); }
    renderer.domElement.style.cursor = h ? 'pointer' : '';
    showTip(h, e.clientX, e.clientY);
  });
});
renderer.domElement.addEventListener('pointerleave', e => { if (e.pointerType !== 'mouse') return; tip.hidden = true; if (state.hover) { state.hover = null; applyStyles(); } });

// ---------- Цикл ----------
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); labelRenderer.setSize(r.width, r.height);
  renderer.domElement.style.width = r.width + 'px'; renderer.domElement.style.height = r.height + 'px';
  camera.aspect = r.width / Math.max(1, r.height);
  // В портретной ориентации расширяем угол обзора, чтобы машина целиком помещалась по ширине
  camera.fov = camera.aspect < 1.2 ? Math.min(80, 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(19)) * 1.2 / camera.aspect))) : 38;
  updateViewOffset();
}
// На телефоне открытая шторка закрывает низ экрана: сдвигаем картинку вверх, в видимую часть
function updateViewOffset() {
  const r = stage.getBoundingClientRect(), d = $('#drawer');
  let cover = 0;
  if (isMobile() && !d.classList.contains('empty') && getComputedStyle(d).display !== 'none') cover = d.getBoundingClientRect().height;
  if (cover > 80) camera.setViewOffset(r.width, r.height, 0, Math.min(cover, r.height * 0.7) / 2, r.width, r.height);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
new ResizeObserver(() => updateViewOffset()).observe($('#drawer'));
new ResizeObserver(resize).observe(stage);
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
renderer.setAnimationLoop(now => {
  if (flight) {
    const k = Math.min(1, (now - flight.t0) / flight.dur), e = ease(k);
    controls.target.lerpVectors(flight.fromT, flight.toT, e); camera.position.lerpVectors(flight.fromP, flight.toP, e);
    if (k >= 1) flight = null;
  }
  controls.update();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
});

prepareData(); placeComponents(); buildWires();
try { if (localStorage.getItem('niva2131-ui-hidden')) document.body.classList.add('ui-hidden'); } catch {}
resize(); renderSources(); renderHarnesses(); renderList(); renderDrawer(); renderPins(); applyStyles();
$('#loading').remove();
</script>
